name: Deploy to GitHub Pages

# ci.yml runs these same tests on every pull request, so a break is caught
# there first; they run again here because the deploy is what ships them.

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Only the gh-pages branch is written, via the default token.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # No dependencies to install: the app is plain ES modules and the tests
      # are plain Node. The suites that need a game install skip themselves.
      - name: Unit tests
        run: npm test

      - name: Build the site
        run: node tools/build-site.js

      # Gate the deploy on the page actually booting. Nothing here is bundled,
      # so a bad import path or a missing data file would otherwise ship as a
      # white screen. Served from a subdirectory to match the Pages URL.
      - name: Install Chromium for the smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: node test/smoke.js

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
